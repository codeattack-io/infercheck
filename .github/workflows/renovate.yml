name: Renovate

on:
  schedule:
    - cron: "0 7 * * 1"
  issues:
    types: [edited]
  pull_request_target:
    types: [edited]
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Override default log level"
        required: false
        default: "info"
        type: string
      overrideSchedule:
        description: "Override all schedules"
        required: false
        default: "false"
        type: string

concurrency:
  group: renovate
  cancel-in-progress: true

jobs:
  renovate:
    name: Renovate dependency updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate Renovate JSON
        run: jq type .github/renovate.json
      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.10
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          # NOTE: must be the GitHub App slug plus "[bot]".
          RENOVATE_USERNAME: "ca-renovatebot[bot]"
          # NOTE: must match the GitHub App bot user id and name.
          RENOVATE_GIT_AUTHOR: "ca-renovatebot <274336062+ca-renovatebot[bot]@users.noreply.github.com>"
          RENOVATE_PLATFORM_COMMIT: "true"
          RENOVATE_FORCE: ${{ github.event.inputs.overrideSchedule == 'true' && '{''schedule'':null}' || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: .github/renovate.json
